[project]
name = "wallet_project"
version = "0.1.0"
description = "REST API for user wallets"
authors = [
    {name = "anniebeva", email = "anniebeva@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.black]
target-version = ['py313']

[tool.isort]
profile = "black"
known_first_party = ["app"]

[tool.ruff.lint]
ignore = ["B008", "I", "UP"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "ruff (>=0.16.6,<0.17.0)"
]
